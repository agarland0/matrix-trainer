<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matrix Trainer</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#e2e0da;--acc:#2f5bd3;--ok:#1f8a4c;--bad:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--card:#1e1e21;--ink:#ececee;--mute:#9a9aa0;--line:#333338;--acc:#7b9cff;--ok:#4cc27f;--bad:#ff6b5b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 48px}
h1{font-size:19px;margin:2px 0 12px}
h2{font-size:16px;margin:0 0 8px}
nav{display:flex;gap:6px;margin-bottom:14px}
nav button{flex:1;padding:9px 4px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-weight:600;font-size:14px;cursor:pointer}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.mute{color:var(--mute);font-size:13px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--line)}
.btn{padding:10px 14px;border-radius:10px;border:1px solid var(--acc);background:var(--acc);color:#fff;font-weight:600;font-size:15px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--acc)}
.btn.sm{padding:5px 10px;font-size:13px}
.matrix{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#aaa;border:2px solid #333;border-radius:6px;overflow:hidden;max-width:330px;margin:0 auto}
.matrix svg{display:block;width:100%;height:auto;background:#fff}
.matrix.small{max-width:180px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px auto 0;max-width:330px}
.opt{position:relative;background:#fff;border:2px solid #c9c9c9;border-radius:8px;padding:0;cursor:pointer;overflow:hidden}
.opt svg{display:block;width:100%;height:auto}
.opt b{position:absolute;top:2px;left:6px;font-size:11px;color:#888}
.opt.ok{border-color:var(--ok);outline:3px solid var(--ok)}
.opt.bad{border-color:var(--bad);outline:3px solid var(--bad)}
.timer{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:10px}
.timer i{display:block;height:100%;background:var(--acc);transition:width .25s linear}
.timer.low i{background:var(--bad)}
ul,ol{padding-left:20px;margin:6px 0}
li{margin:4px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:12px;color:var(--mute);font-weight:600}
.ok-t{color:var(--ok);font-weight:700}.bad-t{color:var(--bad);font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pair{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;margin-top:8px}
.pair .opt{width:70px;cursor:default}
.ex{padding:10px 0;border-bottom:1px solid var(--line)}.ex:last-child{border-bottom:0}
.pic{color:var(--acc);font-style:normal;font-size:13px}.pic::before{content:'Picture it: ';font-weight:600}
nav button{padding:9px 2px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:default}
</style>
<script data-goatcounter="https://matrix-trainer.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<div class="wrap">
<h1>Matrix Trainer</h1>
<nav>
<button data-m="learn">Learn</button>
<button data-m="practice">Practice</button>
<button data-m="timed">Timed</button>
<button data-m="stats">Weak</button>
</nav>
<div id="main"></div>
</div>
<script>
// ---------- utilities ----------
const SH=['circle','square','triangle','diamond','hexagon','pentagon','star','cross'];
const ISH=['circle','square','triangle','diamond'];
const FILLS=['white','gray','black','striped'];
const FILLC={white:'#ffffff',gray:'#9aa0a6',black:'#222222',striped:'url(#st)'};
const CATS=['Attribute change','Distribution of three','Count / arithmetic','Rotation','Movement','Overlay','Frequency','Mirror','Construction'];
const POS=[[14,14],[50,14],[86,14],[86,50],[86,86],[50,86],[14,86],[14,50]];
const FIGP=[.1,.06];
const FIGS=['<ellipse cx="50" cy="50" rx="37" ry="14"/>','<ellipse cx="50" cy="50" rx="14" ry="37"/>','<rect x="25" y="25" width="50" height="50"/>','<polygon points="50,13 83,85 17,85"/>','<circle cx="50" cy="50" r="38"/>','<polygon points="27,22 73,22 73,36 58,36 58,78 42,78 42,36 27,36"/>'].map(x=>x.replace('/>',' fill="none" stroke="#222" stroke-width="2.6" stroke-linejoin="round"/>'));
const LINES=[[14,14,86,14],[86,14,86,86],[14,86,86,86],[14,14,14,86],[14,14,86,86],[86,14,14,86],[50,14,50,86],[14,50,86,50]];
const MAXL=10;
const R=n=>Math.floor(Math.random()*n);
const pick=a=>a[R(a.length)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const uniq=a=>[...new Set(a)];
const mod=(a,n)=>((a%n)+n)%n;
const bits=m=>{let n=0;while(m){n+=m&1;m>>=1}return n};
const randMask=()=>{const k=2+R(2);return shuf([0,1,2,3,4,5,6,7]).slice(0,k).reduce((m,b)=>m|(1<<b),0)};
const latin=()=>{const s=1+R(2);return (r,c)=>(c+r*s)%3};
const cnt=n=>n===1?'':'s';

// ---------- rule builders ----------
function attr(name,pool,label){return (t,vr)=>{if(vr)t=vr==="const"?"easy":"medium";const v=shuf(pool).slice(0,3);const m=x=>pool.filter(s=>s!==x);
 if(t==='easy')return name==='fill'||name==='ifill'
   ?{cat:'Attribute change',val:(r,c)=>v[c],text:`${label} is set by column: ${v.join(', ')}.`,mut:m}
   :{cat:'Attribute change',val:(r,c)=>v[r],text:`${label}: each row repeats one value.`,mut:m};
 const L=latin();return{cat:'Distribution of three',val:(r,c)=>v[L(r,c)],text:`${label}: every row has one ${v[0]}, one ${v[1]} and one ${v[2]}.`,mut:m}}}
const B={
 shape:attr('shape',SH,'Shape'),
 fill:attr('fill',FILLS,'Shading'),
 ishape:attr('ishape',ISH,'Inner shape'),
 ifill:attr('ifill',FILLS,'Inner shading'),
 size(t,vr){if(vr)t=vr==='prog'?'easy':'medium';if(t==='easy'){const up=R(2);return{cat:'Attribute change',val:(r,c)=>up?c:2-c,text:`Size: ${up?'grows':'shrinks'} from left to right.`,mut:x=>[0,1,2].filter(s=>s!==x)}}
  const v=shuf([0,1,2]),L=latin();return{cat:'Distribution of three',val:(r,c)=>v[L(r,c)],text:'Size: every row has one small, one medium and one large.',mut:x=>[0,1,2].filter(s=>s!==x)}},
 rot(t,v){if(v==='odd'||(v===undefined&&t==='hard'&&Math.random()<.3)){const p=shuf([0,1,2]),a0=R(4)*90;return{cat:'Frequency',val:(r,c)=>mod(a0+(c===p[r]?180:0),360),text:'Orientation: in every row and every column, exactly one shape faces the opposite way.',mut:x=>[x+180,x+90,x-90].map(v=>mod(v,360))}}
  const step=v!==undefined?v:t==='hard'?pick([45,-45,135,-135]):pick([90,-90]);
  const rs=t==='hard'?pick([0,45,-45,90,-90,180]):pick([0,0,90,-90,180]);const a0=R(8)*45;const dir=x=>x>0?'clockwise':'counterclockwise';
  return{cat:'Rotation',val:(r,c)=>mod(a0+r*rs+c*step,360),text:`Rotation: the main shape turns ${Math.abs(step)}° ${dir(step)} at each step along a row`+(rs?`, and ${Math.abs(rs)}°${Math.abs(rs)===180?'':' '+dir(rs)} at each step down a column.`:'. Each column keeps the same angle.'),
  mut:x=>[x+step,x-step,x+180,x+90,x-90,x+45].map(v=>mod(v,360)).filter(v=>v!==x)}},
 count(t,v){let g,text;
  if(!v)v=t==='easy'?'up1':t==='medium'?pick(['up2','down1']):pick(['add','sub','total']);
  const col=rs=>rs?`, and ${rs} more down each column.`:'. Each column stays the same.';
  if(v==='up1'){const rs=R(2),b=1+R(3);g=(r,c)=>b+r*rs+c;text='Count: one more square at each step along a row'+col(rs)}
  else if(v==='up2'){const rs=R(2),b=1+R(2);g=(r,c)=>b+r*rs+2*c;text='Count: two more squares at each step along a row'+col(rs)}
  else if(v==='down1'){const rs=R(2),b=3+R(2);g=(r,c)=>b+r*rs-c;text='Count: one fewer square at each step along a row'+col(rs)}
  else{let G,n=0;const cd=pick(['both','row','col']);const ok=G=>G.flat().every(x=>x>=1&&x<=8)&&(cd==='both'||v==='total'||G[2][0]!==G[0][0]+G[1][0]);
   do{const a=1+R(5),b=1+R(4),c=1+R(4),d=1+R(4);
    if(v==='add')G=cd==='both'?[[a,b,a+b],[c,d,c+d],[a+c,b+d,a+b+c+d]]:[[a,b,a+b],[c,d,c+d],[b,c,b+c]];
    else if(v==='sub')G=cd==='both'?[[a+4,b,a+4-b],[c,d,c-d],[a+4-c,b-d,a+4-b-c+d]]:[[a+4,b,a+4-b],[c+3,d,c+3-d],[b+4,a,b+4-a]];
    else{const T=6+R(4);G=[[a,b,T-a-b],[c,d,T-c-d],[T-a-c,T-b-d,a+b+c+d-T]];G.T=T}
   }while(!ok(G)&&n++<2000);
   const only=cd==='row'?' Only the rows do this; the columns follow no count rule.':cd==='col'?' Only the columns do this; the rows follow no count rule.':'';
   text=v==='total'?`Count: every row and every column adds up to ${G.T}.`:cd==='col'?(v==='add'?'Count: in each column, the bottom cell = the top cell + the middle cell.':'Count: in each column, the bottom cell = the top cell minus the middle cell.')+only:cd==='row'?(v==='add'?'Count: in each row, column 3 = column 1 + column 2.':'Count: in each row, column 3 = column 1 minus column 2.')+only:v==='add'?'Count: column 3 = column 1 + column 2, and row 3 = row 1 + row 2.':'Count: column 3 = column 1 minus column 2, and row 3 = row 1 minus row 2.';
   if(cd==='col'&&v!=='total'){const H=G;G=[0,1,2].map(r=>[0,1,2].map(c=>H[c][r]))}
   g=(r,c)=>G[r][c]}
  return{cat:'Count / arithmetic',val:g,text,mut:x=>[x+1,x-1,x+2,x-2].filter(v=>v>=1&&v<=8)}},
 sides(t,v){let G,n=0;const pk=()=>pick([-2,-1,1,2]);
  do{const a=pk(),b=pk(),c=pk(),d=pk();G=[[a,b,a+b],[c,d,c+d],[a+c,b+d,a+b+c+d]]}
  while((G.flat().some(x=>Math.abs(x)>4)||!(G[0][0]*G[0][1]<0||G[1][0]*G[1][1]<0)||G[2][2]===0)&&n++<3000);
  return{cat:'Count / arithmetic',val:(r,c)=>G[r][c],text:'Signed dots: dots above the line count plus, dots below (shaded side) count minus. In each row, cell 3 = cell 1 + cell 2, so same-side dots add and opposite-side dots cancel. The same works down every column.',
   mut:x=>[x+1,x-1,-x,x+2,x-2].filter(v=>v!==x&&Math.abs(v)<=4)}},
 mir(t,v){const mode=v||(t==='hard'?'both':pick(['row','col']));const m0=R(2);
  const f=mode==='row'?(r,c)=>(m0+c)%2:mode==='col'?(r,c)=>(m0+r)%2:(r,c)=>(m0+r+c)%2;
  const text=mode==='row'?'Mirror: the shape flips left-to-right at each step along a row. Down a column it stays the same.':mode==='col'?'Mirror: the shape flips left-to-right at each step down a column. Along a row it stays the same.':'Mirror: the shape flips left-to-right at each step along a row and at each step down a column.';
  return{cat:'Mirror',val:f,text,mut:x=>[1-x]}},
 build(t,v){const kind=v||pick(['shape','color']);const K=kind==='shape'?3:2;
  const enc=a=>a.reduce((s,x,i)=>s+x*Math.pow(4,i),0),dec=n=>[0,1,2,3].map(i=>Math.floor(n/Math.pow(4,i))%4);
  const m=(p,q)=>{const A=dec(p),B=dec(q);return enc(A.map((a,i)=>a&&B[i]?(a===B[i]?a:0):(a||B[i])))};
  const rc=()=>{const a=[0,0,0,0];shuf([0,1,2,3]).slice(0,2+R(2)).forEach(i=>a[i]=1+R(K));return enc(a)};
  const show=(p,q)=>{const A=dec(p),B=dec(q);let same=0,diff=0;A.forEach((x,i)=>{if(x&&B[i]){if(x===B[i])same++;else diff++}});return same&&diff};
  let G=null;for(let n=0;n<20000&&!G;n++){const a=rc(),b=rc(),c=rc(),d=rc();const g=[[a,b,m(a,b)],[c,d,m(c,d)],[m(a,c),m(b,d),0]];const x=m(g[0][2],g[1][2]);if(x!==m(g[2][0],g[2][1]))continue;g[2][2]=x;
   if(!g.flat().every(Boolean))continue;if(n<15000&&(!show(a,b)||!show(a,c)))continue;if(new Set(g.flat()).size<7)continue;G=g}
  if(!G)G=[[1,4,5],[16,64,80],[17,68,85]];
  const ra=dec(G[2][0]),rb=dec(G[2][1]);
  const traps=[enc(ra.map((a,i)=>a||rb[i])),enc(rb.map((b,i)=>b||ra[i])),enc(ra.map((a,i)=>a&&rb[i]&&a===rb[i]?0:(a||rb[i])))];
  const text=kind==='shape'?'Merge: in each row, cell 3 combines cells 1 and 2 corner by corner. A shape on its own carries over, two matching shapes merge into one, and two different shapes cancel out. The same works down every column.':'Merge: in each row, cell 3 combines cells 1 and 2 corner by corner. A dot on its own carries over, two dots of the same colour merge into one, and a black dot meeting a white dot cancels out. The same works down every column.';
  return{cat:'Overlay',kind,val:(r,c)=>G[r][c],text,
   mut:x=>{const A=dec(x),out=[...traps];for(let i=0;i<4;i++)for(let v=0;v<=K;v++)if(v!==A[i]){const B=A.slice();B[i]=v;out.push(enc(B))}return uniq(out.filter(v=>v&&v!==x))}}},
 hide(t,v){const st=v!==undefined?v:pick([1,2,-1]);const cs=pick([0,1,2]);const p0=R(5);const n=x=>`${Math.abs(x)} position${cnt(Math.abs(x))}`;
  return{cat:'Movement',val:(r,c)=>mod(p0+r*cs+c*st,5),text:`Hidden square: a small square moves ${n(st)} ${st>0?'right':'left'} at each step along a row (wrapping round to the other side)`+(cs?`, and ${n(cs)} right at each step down a column.`:'. Each column keeps the same position.')+' When it passes behind the big shape it is hidden, not gone.',
   mut:x=>[x+1,x-1,x+2,x-2].map(v=>mod(v,5)).filter(v=>v!==x)}},
 nest(t,v){const S=['circle','square','triangle','diamond','hexagon','star'];const pool=shuf(S),X=pool.slice(0,3),Y=pool.slice(3,6);
  const idx=x=>S.indexOf(x)+1,code=(o,i)=>o*10+i;
  const val=(r,c)=>r===0?code(idx(X[c]),0):r===1?code(idx(Y[c]),0):code(idx(Y[c]),idx(X[c]));
  return{cat:'Construction',val,text:'Construction (nesting): down each column, cell 3 puts the shape from cell 1 inside the shape from cell 2. Along each row, each shape appears once.',
   mut:x=>{const o=Math.floor(x/10),i=x%10;const alt=[code(i,o),code(o,0)];if(i)alt.push(code(i,0));X.concat(Y).forEach(z=>{const k=idx(z);if(k!==i)alt.push(code(o,k));if(k!==o)alt.push(code(k,i))});return uniq(alt.filter(v=>v!==x&&Math.floor(v/10)>0))}}},
 spokes(t,v){const mode=v||(t==='hard'?'opp':'same');const p0=R(8),rd=pick([1,-1]),cd=mode==='opp'?-rd:rd;const nm=d=>d>0?'clockwise':'counterclockwise';
  const val=(r,c)=>{let a=p0,b=p0;const add=(k,d)=>{for(let j=0;j<k;j++){if(d>0)b++;else a--}};add(c,rd);add(r,cd);let m=0;for(let k=a;k<=b;k++)m|=1<<mod(k,8);return m};
  const text=mode==='same'?`Spokes: one spoke is added at each step along a row and at each step down a column, always on the ${nm(rd)} end.`:`Spokes: along a row a spoke is added on the ${nm(rd)} end; down a column it is added on the ${nm(cd)} end.`;
  return{cat:'Count / arithmetic',val,text,mut:x=>{const r1=((x<<1)|(x>>7))&255,r2=((x>>1)|((x&1)<<7))&255;return uniq([r1,r2,x|r1,x|r2,x&r1,x&r2].filter(v=>v&&v!==x))}}},
 ngon(t,v){const mode=v||(t==='hard'?'both':pick(['row','col']));const n0=3+R(mode==='both'?2:3);
  const f=mode==='row'?(r,c)=>n0+c:mode==='col'?(r,c)=>n0+r:(r,c)=>n0+r+c;
  const text=mode==='row'?'Sides: the shape gains one side at each step along a row. Down a column it stays the same.':mode==='col'?'Sides: the shape gains one side at each step down a column. Along a row it stays the same.':'Sides: the shape gains one side at each step along a row and one more at each step down a column.';
  return{cat:'Attribute change',val:f,text,mut:x=>[x+1,x-1,x+2,x-2].filter(v=>v>=3&&v<=8&&v!==x)}},
 pos(t,v){return mover(t,'Dot',v)},
 pos2(t,v){return mover('hard','Ring',v)},
 lines(t,v,nb,dir){nb=nb||8;dir=dir||(t==='hard'?pick(['row','col','row','both']):pick(['row','col','both']));const fig=nb===6;const rm=()=>{const k=2+R(2);return shuf([...Array(nb).keys()]).slice(0,k).reduce((m,b)=>m|(1<<b),0)};const op=v||(t==='hard'?pick(['xor','sub','and','rsub']):'or');
  const f={or:(a,b)=>a|b,xor:(a,b)=>a^b,sub:(a,b)=>a&~b,and:(a,b)=>a&b,rsub:(a,b)=>b&~a}[op];
  let G=null;const inf=(p,q)=>op==='or'?(p&~q)&&(q&~p):op==='and'?(p&~q)&&(q&~p)&&(p&q):op==='xor'?(p&q)&&(p&~q|q&~p):(p&q)&&(op==='sub'?(p&~q):(q&~p));
  for(let n=0;n<4000&&!G;n++){const a=rm(),b=rm(),c=rm(),d=rm();let g;
   if(dir==='both'){g=[[a,b,f(a,b)],[c,d,f(c,d)],[f(a,c),f(b,d),0]];const x=f(g[0][2],g[1][2]);if(x!==f(g[2][0],g[2][1]))continue;g[2][2]=x}
   else{const e=rm(),h=rm();g=[[a,b,f(a,b)],[c,d,f(c,d)],[e,h,f(e,h)]];if(!inf(e,h)||!inf(c,d))continue}
   if(!g.flat().every(Boolean))continue;
   if(!inf(a,b)||(dir==='both'&&!inf(a,c)))continue;if(new Set(g.flat()).size<7)continue;G=g}
  if(!G)G=fig?[[3,6,f(3,6)||5],[12,24,f(12,24)||48],[f(3,12)||9,f(6,24)||18,f(f(3,6)||5,f(12,24)||48)||33]]:[[1,2,f(1,2)||4],[8,16,f(8,16)||32],[f(1,8)||64,f(2,16)||128,3]];
  const same=dir==='both'?' The same rule also works down every column.':dir==='row'?' Only the rows do this. The columns follow no overlay rule, so don\'t look for one there.':' Only the columns do this. The rows follow no overlay rule.';
  const ftext={or:'Outlines: in each row, cell 3 holds every outline from cells 1 and 2, drawn on top of each other.',xor:'Outlines: in each row, cell 3 keeps outlines that appear in only one of cells 1 and 2. Outlines in both cancel out.',sub:'Outlines: in each row, cell 3 = cell 1 with any outline also in cell 2 removed.',rsub:'Outlines: in each row, cell 3 = cell 2 with any outline also in cell 1 removed (reversed subtraction).',and:'Outlines: in each row, cell 3 keeps only the outlines that appear in both cells 1 and 2.'};
  const text0={or:'Lines: in each row, cell 3 shows every line from cells 1 and 2 combined.',xor:'Lines: in each row, cell 3 keeps lines that appear in only one of cells 1 and 2. Shared lines cancel out.',sub:'Lines: in each row, cell 3 = cell 1 with any line also in cell 2 removed.',rsub:'Lines: in each row, cell 3 = cell 2 with any line also in cell 1 removed (reversed subtraction).',and:'Lines: in each row, cell 3 keeps only the lines that appear in both cells 1 and 2 (intersection).'};let text=(fig?ftext:text0)[op];if(dir==='col')text=text.replace('in each row','in each column').replace('cell 3','the bottom cell').replace('cells 1 and 2','the top two cells').replace('cell 1','the top cell').replace('cell 2','the middle cell');text+=same+(fig?' The outlines overlap, so first name each one (oval, square, triangle…), then run the check one outline at a time.':'');
  return{cat:'Overlay',val:dir==='col'?(r,c)=>G[c][r]:(r,c)=>G[r][c],src:dir==='col'?[[0,2],[1,2]]:[[2,0],[2,1]],text,trap:true,
   mut:x=>{const m=[];for(let i=0;i<nb;i++)m.push(x^(1<<i));return m.filter(v=>v&&v!==x)}}},
 figs(t,v,d){return B.lines(t,v,6,d)}
};
function mover(t,label,v){const step=v!==undefined?v:t==='hard'?pick([2,-2,3,-3]):pick([1,-1]);

const OVFAST=`<div style="margin:10px 0 4px"><b>Your check: Add / Subtract / Shared / Cancel</b>
<p class="mute" style="margin:4px 0">Use row 1 (it's complete). Ask which one describes cell 3:</p>
<table><tr><th>Check</th><th>Cell 3 is…</th><th>Rule</th></tr>
<tr><td><b>Add</b></td><td>everything from both cells</td><td>Addition (OR)</td></tr>
<tr><td><b>Subtract</b></td><td>one cell with the other's lines erased (check both ways: 1 − 2 and 2 − 1)</td><td>Subtraction</td></tr>
<tr><td><b>Shared</b></td><td>only the lines both cells have</td><td>Intersection (AND)</td></tr>
<tr><td><b>Cancel</b></td><td>the differences only; shared lines vanish</td><td>XOR</td></tr></table>
<p class="mute" style="margin:6px 0 0"><b>Cancel cross-check:</b> in a Cancel row, every line shows up in exactly two of the three cells.<br>
<b>Try both directions:</b> the overlay may run along the rows, down the columns, or both. If row 1 fails every check, try column 1 (top two cells → bottom cell). If cell 3 has a line in neither cell 1 nor cell 2, it isn't an overlay in that direction.<br>
<b>Same check works on dots, small shapes and whole outlines</b>, not only lines. When outlines are stacked on top of each other, list them by name for cells 1 and 2 before you compare.<br><b>Whole shapes inside each other?</b> That's nesting construction: one cell's shape goes inside the other's.<br><b>Corner parts instead of lines?</b> That's partial merge: a part on its own carries over, matching parts merge, clashing parts (different shapes, or black meeting white) cancel.</p></div>`;

function rLearn(){
 main.innerHTML=`
 <div class="card"><h2>The six rule types</h2><p class="mute">Beyond these six, the rule library below also covers construction (nesting and partial merge), mirror flips, hidden objects, signed counting, spokes, sides progression, striped shading, odd-one-out orientation, fused outlines (whole shapes stacked on top of each other) and multi-figure puzzles (several separate figures that move around and each follow their own rule). A rule says how something changes. An attribute is what changes: shape, shading, size, count, position, orientation or lines. Any rule can act on any attribute that fits, so shading shows up under Attribute change (light to dark across a row) and Distribution of three (one white, one gray, one black per row). Harder puzzles stack two to five rules, each on a different attribute.</p>${EXP}</div>
 <div class="card"><h2>Rule library</h2><p class="mute" style="margin:0">Every variant of every rule, each as a single-rule puzzle with its answer. Tap "Show another" to see a fresh example of the same variant until you can spot it instantly.</p></div>${rLibrary()}
 <div class="card"><h2>Method for every puzzle</h2><ol>
 <li><b>Build the answer before you look at the options.</b> Strong solvers spend most of their time on the matrix and rarely flick back and forth to the answers. <b>On hard items, use the 3-step routine:</b> (1) solve the 2–3 most distinctive rules, (2) use them to knock out options, (3) check the one left against every row and column and every element, inner ones included. Building the full answer from scratch can eat the clock.</li>
 <li>Split the cell into elements: shape, shading, size, count, dot, lines. Find one rule, lock it in, then move to the next. Juggling several rules at once is where hard puzzles fall apart.</li>
 <li><b>Patterns run across the rows and down the columns, never diagonally</b> (the standard rule in tests of this kind). An element can follow one rule along the rows and a different one down the columns, or change in only one direction. Check both directions for every element before you trust a rule.</li>
 <li><b>Your answer must fit every row and every column.</b> If the answer your row rule gives clashes with what the columns show, one of your rules is wrong. If something seems to appear from nowhere, re-read that element: it's following a different rule than you think.</li>
 <li><b>Turned or flipped?</b> If no amount of turning gets you from one cell to the next, it's a mirror flip. Check whether the shape changed hands.</li>
 <li><b>Gone or hidden?</b> If an element vanishes where a bigger shape sits, assume it's behind the shape and keep tracking its steps.</li>
 <li><b>Built from the other cells?</b> Check for construction: everything combined, one shape nested inside another, or only some parts surviving.</li>
 <li><b>Several separate figures in each cell?</b> Match them up first: find each figure by its shape in every cell, even when it has moved to another spot. Then track each figure on its own: where it moves, and how its shading and size change. Watch for look-alikes such as a square and a diamond (a square turned 45°). A wrong option often gives one figure the look that belongs to another.</li>
 <li><b>Outlines stacked on top of each other?</b> Pull them apart before you test anything: name each outline in cells 1 and 2, then run Add / Subtract / Shared / Cancel one outline at a time. Seeing the separate shapes is the hard part; the rule itself is usually simple.</li>
 <li><b>Solve the lines first.</b> An overlay check (Add / Subtract / Shared / Cancel) usually knocks out half the options, so the remaining elements are quicker to check.</li>
 <li>Only if you can't build the full answer: use the rules you did find to rule out options. This is a fallback, not the default.</li>
 <li><b>Never leave a blank.</b> An unanswered question counts as wrong, and you can't skip and come back. At the 30-second warning, pick your best remaining option.</li>
 <li>Every question has its own 2-minute clock and spare time doesn't carry over. If you finish early, run the element checklist before you click: outer shape, outer shading, inner shape, inner shading, dot, ring, lines, count. Most misses at the top levels are one element left unchecked.</li>
 <li><b>Wrong options here give nothing away.</b> From level 5 up, all six options get the easy rules right. The wrong ones differ from the answer only on the two or three hardest rules, so shape or count alone rules nothing out. You have to solve the hard rules. Picking the most typical option, the odd one out, the one with the most near-identical neighbours, or skipping options that copy a grid figure all work only about as often as a blind guess.</li></ol></div>
 <div class="card"><h2>How to use this trainer</h2><ul>
 <li><b>Practice:</b> untimed. Say the rule out loud, then answer. You see the rules after each puzzle.</li>
 <li><b>Timed 20:</b> 20 puzzles, 2 minutes each, difficulty adapts to your answers. Review comes at the end.</li>
 <li><b>Weak spots:</b> misses counted by the rule you actually got wrong, saved in this browser. Drill your top two.</li>
 <li><b>Focus:</b> in Practice, pick one family to drill, including Inner element and Several separate figures.</li>
 <li><b>Timed sets</b> leave out signed dots and mirror flips. They still appear in Practice and the library.</li></ul>
 <p class="mute">Levels 1–4 cover the rule types. Levels 5–6 combine hard rules. Levels 7–8 stack four or five rules and add inner shapes and a second moving marker. Levels 9–10 are the hardest: four or five rules with up to three hard ones, fused outlines, or three separate figures with look-alike shapes that move and change on their own. From level 2 up, wrong options are built so that no shortcut beats a blind guess: most typical option, odd one out, most near-identical neighbours, skipping grid copies, or skipping unfamiliar colours and values. From level 5 up, all six options agree on the easy rules and differ only on the two or three hardest, so the easy rules rule nothing out. Two or three hard rules usually isolate the answer, and the difficulty is in finding and solving them among the look-alike figures. Newer rule types: construction by nesting, spokes and sides progression (from level 3), mirror flips (from level 4), partial merge with shapes or colours (from level 5), hidden objects (from level 6), signed counting and odd-one-out orientation (from level 7). These are original practice puzzles. They train the same skills but do not reproduce any test's items, and the trainer's levels are not test scores.</p></div>`;

 <p class="mute">Higher late-set levels mean you held hard items. Track this number across sets; it is not a test score.</p>
 ${ms.length?`<p><b>Misses by the rule you got wrong:</b> ${ms.map(([c,n])=>`${c} (${n})`).join(', ')}</p>`:''}
 <p class="mute">${st.localOnly?'Saved on this device. It uploads automatically when you are back online.':'Saved permanently.'}</p>
 <button class="btn" id="back">Back to sets</button></div>${(st.misses||[]).map(m=>missCard(m,'Q'+m.q)).join('')}`}
function rTimed(){
 if(TS.on){drawT();clearInterval(timerId);timerId=setInterval(tick,250);return}
 if(DR)return drawDrill();
 if(VIEW){const st=SETS.find(x=>x.id===VIEW);if(st){main.innerHTML=setHTML(st);document.getElementById('back').onclick=()=>{VIEW=null;render();window.scrollTo(0,0)};return}VIEW=null}
 const bank=missBank(false),all=missBank(true);
 const trend=SETS.slice(0,8).reverse().map(x=>x.late).join(' → ');
 main.innerHTML=`<div class="card"><h2>Timed set</h2><p>20 puzzles, 2 minutes each. Right answers raise the difficulty, wrong ones lower it. No feedback until the end. Every set is saved permanently.</p>
  <p class="mute">Do it in one sitting, somewhere quiet. It takes 15 to 30 minutes.</p><button class="btn" id="go">Start</button></div>
 <div class="card"><h2>Drill my misses</h2><p>${bank.length} missed puzzle${bank.length===1?'':'s'} to clear${all.length>bank.length?` (${all.length-bank.length} already cleared)`:''}. Answer one right and it's cleared.</p>
  <div class="row"><button class="btn" id="drill" ${bank.length?'':'disabled'}>Drill misses</button>${all.length>bank.length?'<button class="btn ghost" id="drillall">Include cleared</button>':''}</div></div>
 <div class="card"><h2>Past sets</h2><p class="mute">${DBSTATE==='loading'?'Loading saved sets…':DBSTATE==='db'?'Saved permanently and available on every device.':'Saved database unreachable right now: showing this device\'s copy.'}</p>
  ${trend?`<p class="mute">Late-set level trend: ${trend}</p>`:''}
  ${SETS.length?`<table><tr><th>When</th><th>Score</th><th>Late level</th><th>Misses</th></tr>${SETS.map(x=>`<tr data-set="${x.id}" style="cursor:pointer"><td>${fmtDate(x.at)}${x.at<OPTIONS_V2_SINCE?' <span class="mute">(pre-fix)</span>':x.at<OPTIONS_V3_SINCE?' <span class="mute">(older options)</span>':''}</td><td>${x.ok}/20</td><td>${x.late}</td><td>${(x.misses||[]).length} ›</td></tr>`).join('')}</table>`:'<p>No sets yet.</p>'}</div>`;
 document.getElementById('go').onclick=()=>{Object.assign(TS,{on:true,i:0,level:3,res:[]});nextT()};
 const dr=document.getElementById('drill');if(dr)dr.onclick=()=>startDrill(false);
 const da=document.getElementById('drillall');if(da)da.onclick=()=>startDrill(true);
 main.querySelectorAll('[data-set]').forEach(tr=>tr.onclick=()=>{VIEW=tr.dataset.set;render();window.scrollTo(0,0)});
}
function startDrill(all){const list=shuf(missBank(all));if(!list.length)return;DR={list,i:0,done:false,ok:0};render()}
function drawDrill(){const it=DR.list[DR.i];if(!it){main.innerHTML=`<div class="card"><h2>Drill done</h2><p>${DR.ok}/${DR.list.length} right this round.</p><button class="btn" id="fin">Back</button></div>`;document.getElementById('fin').onclick=()=>{DR=null;render()};return}
 const src=it.m.p;const order=shuf([0,1,2,3,4,5]);const p=Object.assign({},src,{opts:order.map(k=>src.opts[k]),correct:order.indexOf(src.correct)});
 main.innerHTML=`<div class="bar"><span class="pill">Miss ${DR.i+1}/${DR.list.length}</span><span class="mute">from ${fmtDate(it.st.at)} · level ${p.level}</span><button class="btn sm ghost" id="quit">Stop</button></div>
 <div class="card">${matrixHTML(p)}${optsHTML(p)}<div id="fb"></div></div>`;
 document.getElementById('quit').onclick=()=>{DR=null;render()};
 let done=false;main.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(done)return;done=true;const i=+b.dataset.i,ok=i===p.correct;if(ok){DR.ok++;markCleared(it.st,it.m.q)}
  main.querySelectorAll('.opt')[p.correct].classList.add('ok');if(!ok)b.classList.add('bad');
  document.getElementById('fb').innerHTML=`<p class="${ok?'ok-t':'bad-t'}">${ok?'Correct. Cleared.':'Not yet. Answer: '+'ABCDEF'[p.correct]+'. It stays in your bank.'}</p><ul>${p.rules.map(u=>`<li>${ruleHTML(u)}</li>`).join('')}</ul><button class="btn" id="nx">Next</button>`;
  document.getElementById('nx').onclick=()=>{DR.i++;render();window.scrollTo(0,0)}});
}
function nextT(){TS.p=gen(TS.level,null,{timed:1});TS.start=Date.now();TS.dl=TS.start+120000;drawT();clearInterval(timerId);timerId=setInterval(tick,250)}
function tick(){if(mode!=='timed'||!TS.on)return clearInterval(timerId);const left=TS.dl-Date.now();
 const bar=document.getElementById('tb'),lab=document.getElementById('tl');
 if(left<=0)return answerT(null);
 if(bar){bar.style.width=(left/1200)+'%';bar.parentNode.classList.toggle('low',left<20000)}
 if(lab){const s=Math.ceil(left/1000);lab.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}}
function drawT(){const p=TS.p;
 main.innerHTML=`<div class="bar"><span class="pill">Q ${TS.i+1}/20</span><span class="pill" id="tl">2:00</span></div>
 <div class="timer"><i id="tb" style="width:100%"></i></div><div class="card">${matrixHTML(p)}${optsHTML(p)}</div>`;
 main.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answerT(+b.dataset.i));tick()}
function answerT(i){clearInterval(timerId);const p=TS.p,ok=i===p.correct;
 TS.res.push({p,pick:i,ok,t:Math.min(120,(Date.now()-TS.start)/1000)});record(p,ok,i);
 TS.level=ok?Math.min(MAXL,TS.level+1):Math.max(1,TS.level-1);TS.i++;
 if(TS.i>=20){TS.on=false;const r=TS.res,late=r.slice(10);const missCats={};r.filter(x=>!x.ok).forEach(x=>wrongCats(x.p,x.pick).forEach(c=>missCats[c]=(missCats[c]||0)+1));
  const at=Date.now(),set={id:'s'+at,at,ok:r.filter(x=>x.ok).length,late:+(late.reduce((s,x)=>s+x.p.level,0)/late.length).toFixed(1),mins:Math.round(r.reduce((s,x)=>s+x.t,0)/60),
   path:r.map(x=>({l:x.p.level,o:x.ok?1:0})),missCats,misses:r.map((x,k)=>x.ok?null:{q:k+1,pick:x.pick,p:ser(x.p)}).filter(Boolean),cleared:{}};
  VIEW=set.id;saveSet(set).then(()=>{if(mode==='timed'&&VIEW===set.id)render()});render()}else nextT();window.scrollTo(0,0)}
function rStats(){
 const rows=CATS.map(c=>{const a=STATS.a[c]||0,m=STATS.m[c]||0;return{c,a,m,r:a?m/a:0}}).sort((x,y)=>y.r-x.r||y.a-x.a);
 main.innerHTML=`<div class="card"><h2>Weak spots</h2><p class="mute">Every practice and timed puzzle counts toward each rule type it used. Saved in this browser only.</p>
 <table><tr><th>Rule type</th><th>Seen</th><th>Missed</th><th>Miss rate</th></tr>
 ${rows.map(x=>`<tr><td>${x.c}</td><td>${x.a}</td><td>${x.m}</td><td>${x.a?Math.round(x.r*100)+'%':'–'}</td></tr>`).join('')}</table>
 <p style="margin-top:12px">Drill the top two in Practice: set the level by hand and keep going until you see each rule type a few times.</p>
 <button class="btn ghost" id="rs">Reset stats</button><span id="rsc"></span></div>`;
 document.getElementById('rs').onclick=()=>{document.getElementById('rsc').innerHTML=' <button class="btn sm" id="rs2">Tap to confirm</button>';
  document.getElementById('rs2').onclick=()=>{STATS={a:{},m:{}};saveStats(STATS);render()}};
}
setMode('learn');

// offline support: upload anything saved while offline as soon as the connection is back
let syncBusy=false;const withTO=(pr,ms=15000)=>Promise.race([pr,new Promise((_,j)=>setTimeout(()=>j(new Error('timeout')),ms))]);
async function syncPending(){if(!DB||syncBusy||navigator.onLine===false)return;syncBusy=true;let ch=false;
 try{for(const x of SETS)if(x.localOnly){try{const c=Object.assign({},x);delete c.localOnly;await withTO(DB.collection('timed').doc(x.id).set(c));x.localOnly=false;ch=true}catch(e){}}
  if(ch){saveLocal();if(mode==='timed'&&!TS.on)render()}}finally{syncBusy=false}}
window.addEventListener('online',()=>setTimeout(syncPending,1500));setInterval(syncPending,60000);
</script>
