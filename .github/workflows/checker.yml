name: Shortcut checker

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generator fingerprint, sanity and frozen-solver tests
        run: node --test tools/*.test.js
      - name: Shortcut checker (fails if an option-only shortcut beats 25% at levels 5 to 10)
        run: node tools/checker.js --gate
